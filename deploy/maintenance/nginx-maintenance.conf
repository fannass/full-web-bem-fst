# ==============================================================================
# BEM FST UNISA — Nginx Maintenance Mode Snippet (Flag File + Cookie Bypass)
# ==============================================================================
# Cara pasang di server Ubuntu:
# 1. Copy halaman maintenance:
#      sudo mkdir -p /var/www/maintenance
#      sudo cp deploy/maintenance/maintenance.html /var/www/maintenance/maintenance.html
# 2. Ganti `GANTI_KODE_RAHASIA_KAMU` di bawah dengan string acak panjang.
# 3. Tempel blok di bawah ke dalam `server { ... }` di config Nginx kamu.
#    - Jika masih di subpath `/bem-test/` pada `mataf-fst.unisayogya.ac.id`,
#      taruh `if ($maintenance = 1) { return 503; }` HANYA di `location /bem-test/`
#      dan `location /api/` agar website `mataf` di `/` tetap normal.
#    - Jika sudah pindah ke domain sendiri `bemfst.unisayogya.ac.id`,
#      taruh di `location /` dan `location /api/`.
# 4. Uji & reload Nginx:
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# --- [1] Taruh di level `server { ... }` ---
set $maintenance 0;
if (-f /var/www/bem-maintenance.on) {
    set $maintenance 1;
}

# Bypass otomatis untuk browser admin/developer yang sudah punya cookie preview
if ($cookie_bem_preview = "GANTI_KODE_RAHASIA_KAMU") {
    set $maintenance 0;
}

# URL rahasia untuk mengaktifkan bypass di browser kamu (berlaku 12 jam)
# Ganti redirect `/bem-test/` menjadi `/` saat sudah pakai domain bemfst sendiri
location = /_bem-preview {
    add_header Set-Cookie "bem_preview=GANTI_KODE_RAHASIA_KAMU; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=43200";
    return 302 /bem-test/;
}

# URL opsional untuk menghapus cookie preview (tes tampilan pengunjung biasa)
location = /_bem-preview-off {
    add_header Set-Cookie "bem_preview=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0";
    return 302 /bem-test/;
}

# Handler halaman Under Maintenance (HTTP 503)
error_page 503 @maintenance;
location @maintenance {
    root /var/www/maintenance;
    rewrite ^(.*)$ /maintenance.html break;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# --- [2] Tambahkan 1 baris pengecekan ini di dalam location BEM & API ---
